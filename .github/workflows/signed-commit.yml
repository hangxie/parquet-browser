name: Check signed commits in PR
# pull_request_target only: a pull_request run cannot get the comment permission and fails at
# startup. Safe because the job never checks out or runs PR code.
on: pull_request_target

jobs:
  check-signed-commits:
    name: Check signed commits in PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check signed commits in PR
        uses: 1Password/check-signed-commits-action@v1
